<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cute & Fake — Atlas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1 · Home: slot machine (one reel per element) -->
  <section id="home" class="view">
    <header class="home-head">
      <h1 id="site-title"></h1>
      <p id="site-subtitle"></p>
    </header>
    <div id="machine">
      <div id="reels"></div>
      <div id="lever" title="Pull me"></div>
    </div>
    <a id="combo-link" href="#/">
      <span class="combo-eq">=</span>
      <span id="combo-text"></span>
      <span class="combo-go">open this combination →</span>
    </a>
  </section>

  <!-- 2 · Expanded timeline -->
  <section id="timeline" class="view hidden">
    <div id="viewport"><div id="world"></div></div>
    <div class="hud hud-top">
      <a href="#/" class="back">← machine</a>
      <span id="tl-category"></span>
    </div>
    <div class="hud hud-year"><span id="tl-year"></span><small id="tl-count"></small></div>
    <div class="hud hud-hint" id="tl-hint">scroll / ↓ to travel back in time</div>
    <div id="minimap"><div id="minimap-cursor"></div></div>
    <div id="tooltip" class="hidden"></div>
  </section>

  <!-- 3 · Information mode -->
  <section id="info" class="view overlay hidden">
    <div class="info-panel">
      <a href="#/" class="close" id="info-close">×</a>
      <div id="info-content"></div>
    </div>
  </section>

  <a href="#/info" id="info-button" class="hud">info</a>

  <!-- data generated by scraper/build.py -->
  <script src="data/atlas.js"></script>
  <script src="js/timescale.js"></script>
  <script src="js/media.js"></script>
  <script src="js/home.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/info.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
